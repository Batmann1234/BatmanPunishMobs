name: BatmanPunishMobs
version: 2.1.0
main: net.valterion.batmanpunishmobs.BatmanPunishMobs
api-version: '1.21'
softdepend: [WorldGuard]
description: Un mob castiga al jugador (Warden, Creeper, Blaze, Ravager y 10 animaciones con ItemDisplay) cuando el staff lo sanciona
commands:
  batmanpunishmobs:
    description: Administración de BatmanPunishMobs
    usage: /batmanpunishmobs <reload | run <jugador> <comando>>
    aliases: [bpm]
    permission: batmanpunishmobs.admin
permissions:
  batmanpunishmobs.use:
    description: Las sanciones de este staff activan la animación del mob
    default: op
  batmanpunishmobs.admin:
    description: Recargar la configuración y usar /batmanpunishmobs run
    default: op
