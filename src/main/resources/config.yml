# ============================================================
#  BatmanPunishMobs
# ============================================================

# Qué animación activa cada comando (solo si el jugador sancionado está conectado).
# Animaciones disponibles:
#   WARDEN  -> el Warden sale detrás del jugador, lo congela, lo golpea y luego se ejecuta el comando
#   CREEPER -> un Creeper aparece y hace una explosión falsa (sin congelar, sin daño)
#   BLAZE   -> un Blaze dispara muchas bolas de fuego (sin congelar)
#   RAVAGER -> un Ravager sale detrás del jugador, corre hacia él, lo golpea y luego se ejecuta el comando
#
# NUEVAS (ItemDisplay nativos de Paper, sin MythicMobs; el comando se ejecuta en el momento del golpe final):
#   JACK_BOX     -> un payaso sale de una caja sorpresa y se abalanza sobre el jugador
#   JAWS         -> mandíbulas gigantes brotan del suelo y se cierran sobre el jugador
#   CLOCK        -> reloj gigante con cuenta atrás, tres campanadas y explosión
#   BELL         -> campana gigante que se balancea y se estrella contra el jugador
#   BLIZZARD     -> copo de nieve gigante, estacas de hielo y un bloque de hielo que se rompe
#   ANVIL        -> yunque estilo dibujos animados con sombra en el suelo
#   BLACKHOLE    -> agujero negro con escombros orbitando que absorbe al jugador
#   VEX_SWARM    -> enjambre de Vex (mobs reales) en espiral sobre un círculo ritual
#   EVOKER_FANGS -> un Evoker (mob real) cierra una jaula de colmillos alrededor del jugador
#   GIANT_PUNT   -> un Gigante (mob real) lanza al jugador por los aires
#   RANDOM       -> elige una de las de `random-pool` al azar cada vez
# Para añadir o quitar comandos, edita esta lista (el nombre del comando va en minúsculas).
animations:
  ban: WARDEN
  tempban: WARDEN
  muteip: WARDEN
  warn: CREEPER
  mute: BLAZE
  kick: RAVAGER

# Ejemplos con las nuevas:
#   ban: JAWS
#   tempban: BLACKHOLE
#   kick: GIANT_PUNT
#   mute: BLIZZARD
#   warn: RANDOM

# También interceptar los comandos escritos en la consola (y RCON)
intercept-console: true

# Los mobs de las animaciones ignoran las protecciones (WorldGuard: mob-spawning, deny-spawn,
# invincible, mob-damage...). Si está en false y la zona no permite mobs, NO sale el mob
# y el comando se ejecuta igualmente.
bypass-protections: true

# ------------------------------------------------------------
#  WARDEN
# ------------------------------------------------------------
warden:
  distance: 2.5         # bloques a los que aparece DETRÁS del jugador
  damage: 8.0           # daño del sonic boom (2 = 1 corazón)
  # Ticks (20 = 1 segundo)
  emerge-ticks: 60      # tiempo que tarda en salir del suelo
  charge-ticks: 30      # tiempo cargando el sonic boom antes de disparar
  ban-delay-ticks: 15   # tiempo entre el golpe (el jugador desaparece) y el comando
  leave-delay-ticks: 20 # tiempo entre el comando y que el Warden empiece a hundirse
  dig-ticks: 40         # tiempo hundiéndose antes de desaparecer
  darkness: true        # oscuridad en la pantalla del jugador mientras el Warden aparece

# ------------------------------------------------------------
#  CREEPER
# ------------------------------------------------------------
creeper:
  distance: 2.0         # bloques DELANTE del jugador
  fuse-ticks: 10        # explota a los 10 ticks (medio segundo)

# ------------------------------------------------------------
#  BLAZE
# ------------------------------------------------------------
blaze:
  distance: 3.5         # bloques delante del jugador
  height: 1.5           # bloques por encima del jugador
  duration-ticks: 60    # cuánto tiempo dispara
  fire-interval-ticks: 3 # una bola de fuego cada X ticks
  spread: 0.7           # dispersión de la puntería
  harmless: true        # true = las bolas se apagan al impactar (sin fuego ni daño)

# ------------------------------------------------------------
#  RAVAGER
# ------------------------------------------------------------
ravager:
  start-distance: 12.0      # a cuántos bloques DETRÁS del jugador aparece (menos si no hay espacio)
  speed: 0.6                # bloques por tick que avanza (0.6 = 12 bloques/seg)
  hit-distance: 2.0         # a qué distancia cuenta como "te toca"
  damage: 4.0               # daño del golpe (2 = 1 corazón); nunca mata al jugador
  knockback: 1.2            # fuerza con la que te empuja
  command-delay-ticks: 5    # tiempo entre el golpe y el comando
  max-ticks: 120            # tiempo máximo de carrera; si se pasa, se ejecuta el comando igualmente

# ------------------------------------------------------------
#  NUEVAS ANIMACIONES (JACK_BOX, JAWS, CLOCK, BELL, BLIZZARD, ANVIL, BLACKHOLE,
#  VEX_SWARM, EVOKER_FANGS, GIANT_PUNT)
# ------------------------------------------------------------
shows:
  delay-command: true   # true = el comando real se ejecuta en el golpe final de la animación
  freeze-player: true   # true = el jugador queda congelado (puede mirar, no moverse) mientras dura
  # Se puede cambiar por animación, por ejemplo:
  # JAWS:
  #   delay-command: false   # el comando se ejecuta al instante y la animación se ve igualmente

# Animaciones que puede elegir RANDOM
random-pool:
  - JACK_BOX
  - JAWS
  - CLOCK
  - BELL
  - BLIZZARD
  - ANVIL
  - BLACKHOLE
  - VEX_SWARM
  - EVOKER_FANGS
  - GIANT_PUNT
